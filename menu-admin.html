<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kedai Moi — pilih menu favorit, pesan dari meja, dan pantau pesanan. Pembayaran langsung di kasir."
    />
    <meta name="theme-color" content="#bd2929" />
    <title>Kelola Menu — Kedai Moi</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-halaman="menu-admin">
    <a class="skip-link" href="#utama">Lewati ke konten</a>
    <!-- NAVBAR -->
    <!-- [TEKNOLOGI: SEMANTIC HTML] Header dan nav digunakan konsisten pada enam halaman. -->
    <header class="navbar">
      <div class="wadah">
        <a class="merek" href="index.html" aria-label="Kedai Moi, beranda"
          ><span class="logo"
            ><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7 14a5 5 0 0 1-1-10 6 6 0 0 1 12 0 5 5 0 0 1-1 10v6H7v-6Zm0 3h10"
              /></svg></span
          ><span>kedai moi</span></a
        >
        <nav class="nav-links" id="navigasi" aria-label="Navigasi utama">
          <a href="index.html">Beranda</a><a href="pesan.html">Menu</a
          ><a href="status.html">Status Pesanan</a
          ><a href="dashboard.html" class="admin-link aktif">Kasir</a>
        </nav>
        <div class="nav-kanan">
          <a aria-label="Pesan sekarang" class="tombol tombol-kuning pesan-cepat" href="pesan.html"
            ><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 7h14l1 14H4L5 7Z" />
              <path d="M9 8V5a3 3 0 0 1 6 0v3" /></svg
            ><span>Pesan sekarang</span></a
          >
          <button
            class="hamburger"
            id="buka-navigasi"
            aria-expanded="false"
            aria-controls="navigasi"
            aria-label="Buka navigasi"
          >
            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
    </header>
    <!-- ISI UTAMA -->
    <!-- [TEKNOLOGI: SEMANTIC HTML] Main memuat section, article, form, serta aside sesuai kebutuhan halaman. -->
    <main id="utama" class="wadah halaman">
      <!-- LOGIN ADMIN -->
      <section id="login-admin" class="panel login-wrap">
        <div class="kotak-icon">
          <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V6a4 4 0 0 1 8 0v4m-4 4v3" />
          </svg>
        </div>

        <h1>Masuk kasir</h1>

        <form id="form-login" novalidate>
          <div class="field">
            <label for="pin">PIN admin</label
            ><input
              id="pin"
              name="pin"
              type="password"
              inputmode="numeric"
              pattern="[0-9]{4}"
              maxlength="4"
              autocomplete="current-password"
              required
              placeholder="••••"
              aria-describedby="error-pin"
            /><span class="error" id="error-pin"></span>
          </div>
          <button class="tombol penuh" type="submit">Masuk</button>
        </form>
      </section>
      <div id="konten-admin" hidden>
        <nav class="admin-nav" aria-label="Navigasi admin">
          <a href="dashboard.html">Dashboard</a
          ><a href="menu-admin.html" class="aktif" aria-current="page">Kelola Menu</a
          ><a href="pesanan.html">Kelola Pesanan</a
          ><a href="index.html" id="keluar-admin">Keluar ↗</a>
        </nav>
        <div class="admin-judul">
          <div class="kepala-halaman">
            <h1>Kelola menu</h1>
          </div>
          <div class="grup-tombol">
            <button class="tombol sekunder" id="export-menu">
              <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4" />
              </svg>
              Export CSV</button
            ><button class="tombol" id="tambah-menu">+ Tambah Menu</button>
          </div>
        </div>
        <section aria-label="Daftar menu">
          <div class="toolbar">
            <div class="input-ikon">
              <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m16 16 5 5" /></svg
              ><label class="sr-only" for="cari-admin-menu">Cari nama menu...</label
              ><input
                id="cari-admin-menu"
                type="search"
                placeholder="Cari nama menu..."
                autocomplete="off"
              />
            </div>
            <label class="sr-only" for="filter-kategori">Kategori</label
            ><select id="filter-kategori" aria-label="Kategori">
              <option value="Semua">Semua kategori</option>
              <option value="Makanan">Makanan</option>
              <option value="Minuman">Minuman</option>
              <option value="Cemilan">Cemilan</option></select
            ><label class="sr-only" for="filter-tersedia">Ketersediaan</label
            ><select id="filter-tersedia" aria-label="Ketersediaan">
              <option value="Semua">Semua ketersediaan</option>
              <option value="true">Tersedia</option>
              <option value="false">Habis</option>
            </select>
          </div>
          <p id="jumlah-admin-menu" class="jumlah-hasil" aria-live="polite"></p>
          <div class="tabel-bungkus" tabindex="0" role="region" aria-label="Tabel dapat digeser">
            <table>
              <thead>
                <tr>
                  <th scope="col">Menu</th>
                  <th scope="col">Kategori</th>
                  <th scope="col">Harga</th>
                  <th scope="col">Ketersediaan</th>
                  <th scope="col">Aksi</th>
                </tr>
              </thead>
              <tbody id="tabel-menu"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <!-- FOOTER -->
    <footer class="footer">
      <div class="wadah"><p>© 2026 Kedai Moi</p></div>
    </footer>
    <!-- DIALOG KONFIRMASI DAN NOTIFIKASI -->
    <dialog
      id="modal-konfirmasi"
      aria-labelledby="judul-konfirmasi"
      aria-describedby="teks-konfirmasi"
    >
      <div class="modal-isi">
        <div class="modal-ikon">
          <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h14l1 14H4L5 7Z" />
            <path d="M9 8V5a3 3 0 0 1 6 0v3" />
          </svg>
        </div>
        <h2 id="judul-konfirmasi">Konfirmasi</h2>
        <p id="teks-konfirmasi" class="modal-teks"></p>
        <div class="modal-aksi">
          <button class="tombol sekunder" id="batal-konfirmasi">Kembali</button
          ><button class="tombol" id="setuju-konfirmasi">Ya, lanjutkan</button>
        </div>
      </div>
    </dialog>
    <!-- FORM TAMBAH / EDIT MENU -->
    <dialog id="modal-menu" aria-labelledby="judul-modal-menu">
      <div class="modal-isi">
        <div class="modal-kepala">
          <h2 id="judul-modal-menu">Tambah Menu</h2>
          <button class="tutup-modal" data-tutup="modal-menu" aria-label="Tutup">×</button>
        </div>
        <form id="form-menu" novalidate>
          <div class="field">
            <label for="menu-nama">Nama menu</label
            ><input
              id="menu-nama"
              name="menu-nama"
              type="text"
              placeholder="Contoh: Nasi Goreng"
              required
              maxlength="80"
              aria-describedby="error-menu-nama"
            /><span class="error" id="error-menu-nama"></span>
          </div>
          <div class="form-dua">
            <div class="field">
              <label for="menu-kategori">Kategori</label
              ><select id="menu-kategori" required aria-describedby="error-menu-kategori">
                <option value="">Pilih kategori</option>
                <option>Makanan</option>
                <option>Minuman</option>
                <option>Cemilan</option></select
              ><span class="error" id="error-menu-kategori"></span>
            </div>
            <div class="field">
              <label for="menu-harga">Harga (Rp)</label
              ><input
                id="menu-harga"
                name="menu-harga"
                type="number"
                placeholder="20000"
                min="1"
                step="1"
                required
                aria-describedby="error-menu-harga"
              /><span class="error" id="error-menu-harga"></span>
            </div>
          </div>
          <div class="field">
            <label for="menu-deskripsi">Deskripsi <span>· maksimal 80 karakter</span></label
            ><textarea
              id="menu-deskripsi"
              maxlength="80"
              placeholder="Ceritakan rasa menu ini..."
              aria-describedby="error-menu-deskripsi"
            ></textarea
            ><span class="error" id="error-menu-deskripsi"></span>
          </div>
          <div class="field">
            <label for="menu-emoji">Emoji menu</label
            ><input
              id="menu-emoji"
              name="menu-emoji"
              type="text"
              value="🍽️"
              maxlength="12"
              placeholder="🍽️"
              aria-describedby="error-menu-emoji"
            /><span class="error" id="error-menu-emoji"></span>
          </div>
          <label class="cek"
            ><input id="menu-tersedia" type="checkbox" checked /> Menu tersedia untuk dipesan</label
          >
          <div class="modal-aksi">
            <button class="tombol sekunder" type="button" data-tutup="modal-menu">Batal</button
            ><button type="submit" class="tombol">Simpan Menu</button>
          </div>
        </form>
      </div>
    </dialog>
    <div id="toast-area" class="toast-area" aria-live="polite" aria-atomic="false"></div>
    <noscript
      ><p class="catatan">
        Aktifkan JavaScript agar pemesanan dan pengelolaan data dapat digunakan.
      </p></noscript
    >
    <!-- Script dasar dimuat lebih dahulu, kemudian script halaman. -->
    <script src="js/storage.js"></script>
    <script src="js/validasi.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/export.js"></script>
    <script src="js/menu-admin.js"></script>
    <script src="js/tampilan.js"></script>
  </body>
</html>
